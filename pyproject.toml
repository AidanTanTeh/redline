[project]
name = "redline"
version = "0.1.0"
description = "Prompt-injection red-teaming for LLM apps: attack corpus, detectors, ASR metrics, CI gate."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aidan E Shin Tan Teh" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at ./redline, not ./src/redline.
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear (likely bugs)
    "UP",      # pyupgrade (modern syntax)
    "SIM",     # simplifications
    "ASYNC",   # async mistakes
    "S",       # bandit (security checks)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # plain `assert` is how pytest tests work

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["redline"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Make mypy check model constructors the way Pydantic validates them at runtime.
init_forbid_extra = true  # unknown kwargs are a type error (matches extra="forbid")
init_typed = true         # constructor args must match field types, not Any

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
